name: Build image

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily: if a new stable Tailscale is out, build it and publish a release
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      tailscale_version:
        description: 'Tailscale version (e.g. 1.104.2), or "latest" for the newest stable release'
        default: latest
        required: true
      extra_features:
        description: "Extra Tailscale features, comma-separated (e.g. ssh,useexitnode)"
        default: ""
        required: false

permissions:
  contents: write   # create GitHub releases
  packages: write   # push to ghcr.io

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Multi-arch image (:latest, :<version>), RouterOS pulls the matching one:
  # arm64 (hAP ax2/ax3, RB5009...), arm/v7 (hAP ac2/ac3, RB4011...), amd64 (CHR, x86)
  PLATFORMS: linux/arm64,linux/arm/v7,linux/amd64
  # ARMv5 routers (EN7562 CPU, e.g. hEX refresh) get separate "-armv5" tags,
  # because RouterOS can't be relied on to choose between two 32-bit ARM variants
  PLATFORM_ARMV5: linux/arm/v5

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve Tailscale version and image tags
        id: meta
        env:
          REQUESTED_VERSION: ${{ inputs.tailscale_version || 'latest' }}
          EXTRA_FEATURES: ${{ inputs.extra_features }}
          IS_DEFAULT_BRANCH: ${{ github.ref_name == github.event.repository.default_branch }}
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          version="$REQUESTED_VERSION"
          if [ "$version" = latest ]; then
            # Stable Tailscale releases have an even minor version (1.104.x)
            version=$(git ls-remote --tags --refs https://github.com/tailscale/tailscale.git 'v1.*' \
              | sed -n 's#.*refs/tags/v\(1\.[0-9]*[02468]\.[0-9]*\)$#\1#p' \
              | sort -t. -k1,1n -k2,2n -k3,3n | tail -n 1)
          fi
          if [ -z "$version" ]; then
            echo "::error::Could not determine the Tailscale version"
            exit 1
          fi

          extra=$(echo "$EXTRA_FEATURES" | tr -d ' ')
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          newest=false
          [ "$REQUESTED_VERSION" = latest ] && newest=true
          if [ -n "$extra" ]; then
            tags="$image:$version-$(echo "$extra" | tr ',' '-')"
          else
            tags="$image:$version"
            if [ "$newest" = true ] && [ "$IS_DEFAULT_BRANCH" = true ]; then
              tags="$tags,$image:latest"
            fi
          fi

          # A GitHub release is made for standard builds from the default branch
          release=false
          if [ "$EVENT" != pull_request ] && [ "$IS_DEFAULT_BRANCH" = true ] && [ -z "$extra" ]; then
            release=true
          fi

          tags_armv5=$(echo "$tags" | sed 's/,/-armv5,/g; s/$/-armv5/')

          {
            echo "version=$version"
            echo "extra=$extra"
            echo "tags=$tags"
            echo "tags_armv5=$tags_armv5"
            echo "newest=$newest"
            echo "release=$release"
            echo "release_tag=v$version"
          } >> "$GITHUB_OUTPUT"
          echo "Tailscale $version${extra:+ with extra features $extra} -> $tags (release: $release)"

      - name: Skip if this version is already released
        id: check
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists, nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && steps.check.outputs.skip != 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4
        if: steps.check.outputs.skip != 'true'

      # Multi-arch image on ghcr.io, which RouterOS can pull directly
      - name: Build (and push) the image
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          build-args: |
            TAILSCALE_VERSION=${{ steps.meta.outputs.version }}
            TS_EXTRA_FEATURES=${{ steps.meta.outputs.extra }}
          # plain Docker manifests; RouterOS doesn't need attestations
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build (and push) the ARMv5 image
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORM_ARMV5 }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags_armv5 }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          build-args: |
            TAILSCALE_VERSION=${{ steps.meta.outputs.version }}
            TS_EXTRA_FEATURES=${{ steps.meta.outputs.extra }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # tailscale-<arch>.tar files for /container/add file=... (reuses the build cache)
      - name: Export image archives for RouterOS
        if: steps.check.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          EXTRA: ${{ steps.meta.outputs.extra }}
        run: |
          set -eu
          command -v skopeo > /dev/null || { sudo apt-get update -q && sudo apt-get install -y -q skopeo; }
          for platform in $(echo "$PLATFORMS,$PLATFORM_ARMV5" | tr ',' ' '); do
            arch=$(echo "${platform#linux/}" | tr -d '/')
            docker buildx build --platform "$platform" --load -t "tailscale-mikrotik:$arch" \
              --build-arg TAILSCALE_VERSION="$VERSION" --build-arg TS_EXTRA_FEATURES="$EXTRA" .
            skopeo copy "docker-daemon:tailscale-mikrotik:$arch" "docker-archive:tailscale-$arch.tar"
          done
          ls -l tailscale-*.tar

      - uses: actions/upload-artifact@v7
        if: steps.check.outputs.skip != 'true'
        with:
          path: tailscale-arm64.tar
          archive: false

      - uses: actions/upload-artifact@v7
        if: steps.check.outputs.skip != 'true'
        with:
          path: tailscale-armv7.tar
          archive: false

      - uses: actions/upload-artifact@v7
        if: steps.check.outputs.skip != 'true'
        with:
          path: tailscale-armv5.tar
          archive: false

      - uses: actions/upload-artifact@v7
        if: steps.check.outputs.skip != 'true'
        with:
          path: tailscale-amd64.tar
          archive: false

      # New Tailscale version -> new release; same version rebuilt -> files replaced
      - name: Publish GitHub release
        if: steps.check.outputs.skip != 'true' && steps.meta.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.meta.outputs.version }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          NEWEST: ${{ steps.meta.outputs.newest }}
        run: |
          set -eu
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" tailscale-*.tar --clobber
            echo "Updated the files of release $RELEASE_TAG"
            exit 0
          fi

          also_latest=""
          [ "$NEWEST" = true ] && also_latest=" (also \`:latest\`)"
          sizes=$(for f in tailscale-*.tar; do
            printf -- "- \`%s\` (%s MB)\n" "$f" "$(awk -v b="$(stat -c %s "$f")" 'BEGIN{printf "%.1f", b/1048576}')"
          done)
          cat > notes.md <<EOF
          Tailscale **$VERSION** for MikroTik RouterOS containers. Tailscale changes: https://tailscale.com/changelog

          **Image:** \`$image:$VERSION\`$also_latest, the right one for arm64, 32-bit ARM (ARMv7) and x86 is picked automatically. ARMv5 routers (EN7562 CPU, e.g. hEX refresh): \`$image:$VERSION-armv5\`

          **Files** for \`/container/add file=...\`:
          $sizes

          On the router, either pull the new image (\`/container/stop 0\`, then \`/container/update 0\`), or upload the \`.tar\` for your CPU and recreate the container.
          EOF

          gh release create "$RELEASE_TAG" tailscale-*.tar \
            --title "Tailscale $VERSION" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            --latest="$NEWEST"
          echo "Created release $RELEASE_TAG"
